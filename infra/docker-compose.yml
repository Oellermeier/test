# Vollständiges Setup für Staging/Produktion.
# Für lokale Entwicklung: root docker-compose.yml (nur DB) + npm run dev:all
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-traveldb}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traveldb}
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET required}
      PORT:          3000
      APP_ORIGIN:    ${APP_ORIGIN:-http://localhost:3001}
      SITE_ORIGIN:   ${SITE_ORIGIN:-http://localhost:3002}
      STORAGE_PATH:  /app/uploads
    volumes:
      - media_uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend-app:
    build:
      context: ../frontend-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL:             http://backend:3000
      NEXT_PUBLIC_API_URL: ${APP_PUBLIC_URL:-http://localhost:3001}
    ports:
      - "3001:3001"
    depends_on:
      - backend

  frontend-site:
    build:
      context: ../frontend-site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL:         http://backend:3000
      FAMILY_PASSWORD: ${FAMILY_PASSWORD:?FAMILY_PASSWORD required}
      FAMILY_JWT:      ${FAMILY_JWT:-}
    ports:
      - "3002:4321"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_uploads:
